name: Update contributions

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch contributions
        run: curl -fsSL "https://github-contributions-api.jogruber.de/v4/Nitish-1303?y=last" -o public/contributions.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/contributions.json
          git diff --cached --quiet || git commit -m "chore: update contributions.json"
          git push
